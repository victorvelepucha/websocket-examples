<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebChat with WebSocket</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:,">
</head>
<body>
    <h1>Chat WebSocket</h1>
    
    <div>
        <label for="usernameInput">User name: </label>
        <input type="text" id="usernameInput" placeholder="Input your name" maxlength="20">
    </div>
    
    <div id="messages" role="log" aria-label="Chat messages" aria-live="polite"></div>
    
    <div>
        <input type="text" id="messageInput" placeholder="Write your message..." maxlength="500">
        <button id="sendBtn">Send</button>
    </div>
    
    <div id="statusConnection" style="margin-top: 10px; font-size: 12px; color: #666;"></div>

    <script src="script.js" defer></script>
</body>
</html>
